<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON EXCHANGE | DOP Financial Hub</title>
    
    <!-- Bootstrap 5 & Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <!-- Icons & Flags -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@6.11.0/css/flag-icons.min.css">
    
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --dark-core: #050505;
            --card-bg: rgba(15, 15, 15, 0.9);
        }

        body {
            background-color: var(--dark-core);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            background-image: radial-gradient(circle at 50% 50%, #120024 0%, #050505 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1, h2, h3, .navbar-brand { font-family: 'Orbitron', sans-serif; }

        /* Neon Styles */
        .neon-border-cyan { border: 1px solid var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); }
        .neon-border-pink { border: 1px solid var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); }
        .text-neon { color: var(--neon-cyan); text-shadow: 0 0 5px var(--neon-cyan); }
        .text-pink { color: var(--neon-pink); text-shadow: 0 0 5px var(--neon-pink); }

        /* Navbar */
        .navbar {
            background: rgba(0, 0, 0, 0.9) !important;
            border-bottom: 2px solid var(--neon-cyan);
        }

        .profile-img {
            width: 45px; height: 45px;
            border-radius: 50%;
            border: 2px solid var(--neon-pink);
            cursor: pointer;
            transition: 0.3s;
        }
        .profile-img:hover { transform: rotate(15deg) scale(1.1); }

        /* Currency Cards */
        .currency-card {
            background: var(--card-bg);
            border-radius: 0;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .currency-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 20px var(--neon-pink);
        }
        .rate-value { font-size: 1.8rem; font-weight: bold; }

        /* Calculator */
        .calculator-box {
            background: rgba(0,0,0,0.8);
            border-radius: 15px;
            padding: 30px;
        }

        .form-control, .form-select {
            background: #000;
            border: 1px solid var(--neon-cyan);
            color: white;
            font-family: 'Orbitron', sans-serif;
        }
        .form-control:focus {
            background: #000; color: white;
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
        }

        /* Charts */
        #mainChart { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; }

        /* Modal Custom */
        .modal-content {
            background: #0a0a0a;
            border: 2px solid var(--neon-cyan);
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand text-neon" href="#">
                <i class="fa-solid fa-bolt-lightning"></i> CYBER<span class="text-pink">DOP</span>
            </a>
            <div class="ms-auto d-flex align-items-center">
                <div class="text-end me-3 d-none d-sm-block">
                    <small class="d-block text-secondary">STATUS</small>
                    <small class="text-neon">EN LÍNEA</small>
                </div>
                <img src="https://i.pravatar.cc/150?u=cyberdev" class="profile-img" data-bs-toggle="modal" data-bs-target="#devModal" alt="Dev">
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- HEADER & CALCULATOR -->
        <div class="row g-4 mb-5">
            <div class="col-lg-5">
                <div class="calculator-box neon-border-pink h-100">
                    <h3 class="text-pink mb-4"><i class="fa-solid fa-calculator"></i> CONVERSOR</h3>
                    <div class="mb-3">
                        <label class="form-label small text-secondary">MONTO (RD$)</label>
                        <input type="number" id="calcInput" class="form-control" placeholder="Ej: 1000" oninput="performConversion()">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-secondary">HACIA</label>
                        <select id="calcSelect" class="form-select" onchange="performConversion()">
                            <!-- Cargado por JS -->
                        </select>
                    </div>
                    <div class="text-center mt-4">
                        <h1 id="calcOutput" class="text-neon">0.00</h1>
                        <small id="calcLabel" class="text-secondary">ESPERANDO ENTRADA...</small>
                    </div>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="calculator-box neon-border-cyan h-100">
                    <h3 class="text-neon mb-4"><i class="fa-solid fa-chart-line"></i> MERCADO 6 MESES (USD/DOP)</h3>
                    <div id="mainChart"></div>
                </div>
            </div>
        </div>

        <!-- GRID 12 CURRENCIES -->
        <h2 class="text-center mb-4 text-pink">MONITOR DE DIVISAS</h2>
        <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4 mb-5" id="currencyGrid">
            <!-- Cargado dinámicamente -->
        </div>
    </div>

    <!-- MODAL PERFIL -->
    <div class="modal fade" id="devModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4">
                <div class="modal-body">
                    <img src="https://i.pravatar.cc/150?u=cyberdev" class="rounded-circle border border-info mb-3" width="100">
                    <h3 class="text-neon">DEV_ALPHA_2026</h3>
                    <p class="text-secondary">Especialista en Sistemas Financieros Cyberpunk y APIs de Alta Disponibilidad.</p>
                    <hr class="bg-info">
                    <h6 class="text-pink">TECH STACK</h6>
                    <p class="small">HTML5 • CSS3 • JS ES6 • APEX CHARTS • BOOTSTRAP 5</p>
                    <div class="d-flex justify-content-center gap-3 mt-4">
                        <a href="#" class="text-neon fs-3"><i class="fa-brands fa-github"></i></a>
                        <a href="#" class="text-neon fs-3"><i class="fa-brands fa-linkedin"></i></a>
                        <a href="#" class="text-neon fs-3"><i class="fa-brands fa-x-twitter"></i></a>
                    </div>
                    <button class="btn btn-outline-info mt-4 w-100" data-bs-dismiss="modal">CERRAR TERMINAL</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    
    <script>
        const API_KEY = '492112cd69dea61535b49bb5';
        const BASE_URL = `https://v6.exchangerate-api.com/v6/${API_KEY}/latest/DOP`;

        // Las 12 monedas elegidas
        const currencies = [
            { code: 'USD', name: 'Dólar USA', flag: 'us' },
            { code: 'EUR', name: 'Euro', flag: 'eu' },
            { code: 'GBP', name: 'Libra Esterlina', flag: 'gb' },
            { code: 'CAD', name: 'Dólar Canadiense', flag: 'ca' },
            { code: 'CHF', name: 'Franco Suizo', flag: 'ch' },
            { code: 'JPY', name: 'Yen Japonés', flag: 'jp' },
            { code: 'BRL', name: 'Real Brasileño', flag: 'br' },
            { code: 'MXN', name: 'Peso Mexicano', flag: 'mx' },
            { code: 'CNY', name: 'Yuan Chino', flag: 'cn' },
            { code: 'RUB', name: 'Rublo Ruso', flag: 'ru' },
            { code: 'INR', name: 'Rupia India', flag: 'in' },
            { code: 'KRW', name: 'Won Coreano', flag: 'kr' }
        ];

        let ratesData = {};

        async function getFinancialData() {
            try {
                const response = await fetch(BASE_URL);
                const data = await response.json();
                ratesData = data.conversion_rates;
                
                renderGrid();
                populateSelect();
                initChart();
            } catch (error) {
                console.error("Error de conexión con la red financiera.");
            }
        }

        function renderGrid() {
            const grid = document.getElementById('currencyGrid');
            grid.innerHTML = '';

            currencies.forEach(c => {
                const rateFromDOP = ratesData[c.code];
                // Calculamos cuánto es 1 moneda en DOP (Inversa)
                const oneInDOP = (1 / rateFromDOP).toFixed(2);

                grid.innerHTML += `
                    <div class="col">
                        <div class="card currency-card h-100 neon-border-cyan p-3">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="fi fi-${c.flag} fs-3"></span>
                                <span class="text-secondary small font-monospace">${c.code}</span>
                            </div>
                            <h6 class="text-uppercase small mb-1">${c.name}</h6>
                            <div class="rate-value text-pink">RD$ ${oneInDOP}</div>
                            <div class="mt-2" style="font-size: 0.7rem; color: #555;">
                                CAMBIO REAL: 1.00 ${c.code} = ${oneInDOP} DOP
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function populateSelect() {
            const select = document.getElementById('calcSelect');
            currencies.forEach(c => {
                select.innerHTML += `<option value="${c.code}">${c.name} (${c.code})</option>`;
            });
        }

        function performConversion() {
            const amount = document.getElementById('calcInput').value;
            const target = document.getElementById('calcSelect').value;
            const output = document.getElementById('calcOutput');
            const label = document.getElementById('calcLabel');

            if (amount > 0) {
                const result = (amount * ratesData[target]).toFixed(2);
                output.innerText = `${result} ${target}`;
                label.innerText = `RD$ ${amount} EQUIVALEN A SU VALOR EN ${target}`;
            } else {
                output.innerText = "0.00";
                label.innerText = "ESPERANDO ENTRADA...";
            }
        }

        function initChart() {
            const options = {
                series: [{
                    name: 'DOP/USD',
                    data: [56.40, 56.85, 57.20, 58.10, 58.90, 59.35] // Datos simulados 6 meses
                }],
                chart: {
                    type: 'area',
                    height: 250,
                    toolbar: { show: false },
                    animations: { enabled: true }
                },
                colors: ['#00f3ff'],
                fill: {
                    type: 'gradient',
                    gradient: { shadeIntensity: 1, opacityFrom: 0.7, opacityTo: 0 }
                },
                dataLabels: { enabled: false },
                stroke: { curve: 'smooth', width: 2 },
                xaxis: {
                    categories: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun'],
                    labels: { style: { colors: '#666' } }
                },
                yaxis: { labels: { style: { colors: '#666' } } },
                grid: { borderColor: '#222' },
                theme: { mode: 'dark' }
            };

            const chart = new ApexCharts(document.querySelector("#mainChart"), options);
            chart.render();
        }

        getFinancialData();
    </script>
</body>
</html>
